name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'copilot/**'
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js for release safeguards
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 8 runtime compatibility host
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.422'

      - name: Verify .NET 8 runtime compatibility host
        run: dotnet --list-runtimes | grep -Eq '^Microsoft\.NETCore\.App 8\.0\.28 \['

      - name: Restore dependencies
        run: |
          dotnet restore Emby.M3uEditor.Plugin/Emby.M3uEditor.Plugin.csproj
          dotnet restore Emby.M3uEditor.Plugin.Tests/Emby.M3uEditor.Plugin.Tests.csproj

      - name: Build
        run: |
          dotnet build --no-restore --configuration Release Emby.M3uEditor.Plugin/Emby.M3uEditor.Plugin.csproj
          dotnet build --no-restore --configuration Release Emby.M3uEditor.Plugin.Tests/Emby.M3uEditor.Plugin.Tests.csproj

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" Emby.M3uEditor.Plugin.Tests/Emby.M3uEditor.Plugin.Tests.csproj

      - name: Verify Emby runtime compatibility
        run: bash scripts/test-emby-runtime-compatibility.sh

      - name: Test release safeguards
        run: python3 -m unittest discover -s scripts/release/tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build for CodeQL
        run: |
          dotnet build --configuration Release Emby.M3uEditor.Plugin/Emby.M3uEditor.Plugin.csproj
          dotnet build --configuration Release Emby.M3uEditor.Plugin.Tests/Emby.M3uEditor.Plugin.Tests.csproj

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
